<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weekchat</title>
<style>
:root{--bg:#0b0b0b;--card:#1c1c1e;--ink:#f2efe6;--mute:#a1a1a6;--line:#2e2e32;--gold:#d4af37;--green:#2fbf71;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:0 0 74px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--gold);background:#111}
header h1{margin:0;color:var(--gold);font-size:1.4rem}
main{padding:12px 14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2,h3{color:var(--gold);margin:6px 0}
input,textarea,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#232326;color:var(--ink);font:16px system-ui;margin-bottom:8px}
button{font:600 15px system-ui;padding:11px 14px;border:0;border-radius:8px;background:var(--gold);color:#0b0b0b;cursor:pointer}
button.alt{background:#2a2a2d;color:var(--ink);border:1px solid var(--line)}
button.danger{background:var(--red);color:#fff}
button:disabled{opacity:.5}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111;border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:10px 2px;font-size:12px;white-space:pre-line}
nav button.on{color:var(--gold)}
.big{font:700 2.4rem ui-monospace,monospace;text-align:center;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.mute{color:var(--mute);font-size:14px}
.ok{color:var(--green)}.err{color:#ff8a80}
.item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item .t{flex:1}
.done{opacity:.5;text-decoration:line-through}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.days button{padding:8px 0;font-size:13px}
.post{border-bottom:1px solid var(--line);padding:12px 0}
.post img,.post video{display:block;width:100%;max-height:70vh;object-fit:contain;background:#000;border-radius:8px;margin:8px 0}
#off{display:none;position:fixed;inset:0;background:var(--bg);z-index:9;align-items:center;justify-content:center;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="off"><div><h2>No internet connection</h2><p class="mute">Weekchat works only online. Connect to Wi-Fi or mobile data to continue.</p></div></div>

<h1>Weekchat</h1>
</header>
<main id="app"></main>
<nav id="tabs"></nav>
<script>
(function(){
var U='https://akrbsrtaycdhnhgrmgjp.supabase.co',K='sb_publishable_PO7P6KTzCs-CFQ2yfmnRiQ_0_zglCus',SK='wc_session',DK='wc_plan_v3';
var S=null,tab='home',app=document.getElementById('app'),tabs=document.getElementById('tabs');

try{var raw=JSON.parse(localStorage.getItem(DK));if(raw)D=Object.assign(D,raw)}catch(e){}
function saveD(){try{localStorage.setItem(DK,JSON.stringify(D))}catch(e){}}
function saveS(s){S=s;try{if(s)localStorage.setItem(SK,JSON.stringify(s));else localStorage.removeItem(SK)}catch(e){}}
function el(t,c,txt,p){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;if(p)p.appendChild(e);return e}
function btn(txt,p,fn,c){var b=el('button',c||'',txt,p);b.onclick=fn;return b}
function zz(n){return(n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+zz(d.getMonth()+1)+'-'+zz(d.getDate())}
function msg(e){return(e&&(e.msg||e.error_description||e.message))||'Something went wrong. Check your connection.'}
function norm(j){return{access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),user:j.user}}
async function call(path,body){
  var r=await fetch(U+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json',Authorization:'Bearer '+K},body:JSON.stringify(body||{})});
  var t=await r.text(),j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw j||{msg:'Error '+r.status};return j}
async function token(){
  if(!S)return null;
  if(S.expires_at-60<Date.now()/1000){
    try{saveS(norm(await call('/auth/v1/token?grant_type=refresh_token',{refresh_token:S.refresh_token})))}
    catch(e){saveS(null);render()}
  }
  return S?S.access_token:null}
async function api(method,path,body,extra,raw){
  var t=await token();if(!t)throw{msg:'Please sign in again.'};
  var h={apikey:K,Authorization:'Bearer '+t};
  if(body!==undefined&&!raw)h['Content-Type']='application/json';
  if(extra)for(var k in extra)h[k]=extra[k];
  var r=await fetch(U+path,{method:method,headers:h,body:body===undefined?undefined:(raw?body:JSON.stringify(body))});
  var tx=await r.text(),j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
  if(!r.ok)throw j||{msg:'Error '+r.status};return j}

/* ---------- Sign in / up ---------- */
function authView(){
  app.textContent='';var c=el('div','card',null,app);
  el('h2',null,'Welcome to Weekchat',c);
  el('p','mute','Your campus in your pocket.',c);
  var mode='in';var row=el('div','row',null,c);
  var bIn=btn('Sign in',row,function(){mode='in';draw()},'');
  var bUp=btn('Create account',row,function(){mode='up';draw()},'alt');
  var nm=el('input',null,null,c);nm.placeholder='Full name';nm.maxLength=60;
  var em=el('input',null,null,c);em.placeholder='Email';em.type='email';em.autocomplete='email';
  var pw=el('input',null,null,c);pw.placeholder='Password (8 characters minimum)';pw.type='password';
  var ag=el('label','mute',null,c);var cb=el('input',null,null,ag);cb.type='checkbox';cb.style.width='auto';cb.style.marginRight='6px';ag.appendChild(document.createTextNode('I am 13 or older and I accept the community rules.'));
  var go=btn('Sign in',c,null,'');go.style.width='100%';
  var m=el('p','err',null,c);
  function draw(){var up=mode==='up';nm.style.display=up?'':'none';ag.style.display=up?'':'none';go.textContent=up?'Create my account':'Sign in';bIn.className=up?'alt':'';bUp.className=up?'':'alt';m.textContent=''}
  go.onclick=async function(){
    var e=em.value.trim(),p=pw.value;
    if(!/^\S+@\S+\.\S+$/.test(e)){m.textContent='Enter a valid email.';return}
    if(p.length<8){m.textContent='Password must have 8 characters or more.';return}
    if(mode==='up'){if(!nm.value.trim()){m.textContent='Enter your full name.';return}if(!cb.checked){m.textContent='Please confirm you are 13 or older.';return}}
    go.disabled=true;m.className='mute';m.textContent='Please wait...';
    try{
      if(mode==='up'){
        var j=await call('/auth/v1/signup',{email:e,password:p,data:{name:nm.value.trim()}});
        if(j.access_token){saveS(norm(j));render()}
        else{mode='in';draw();m.className='ok';m.textContent='Account created. Check your email, then sign in.'}
      }else{saveS(norm(await call('/auth/v1/token?grant_type=password',{email:e,password:p})));render()}
    }catch(err){m.className='err';m.textContent=(err&&err.error_code==='invalid_credentials')?'Wrong email or password.':msg(err)}
    go.disabled=false};
  draw();
}

/* ---------- Home: publications with photos and videos ---------- */
var MT={image:'image',video:'video',audio:'audio'};
async function homeView(){
  app.textContent='';
  var c=el('div','card',null,app);
  var ta=el('textarea',null,null,c);ta.rows=3;ta.maxLength=2000;ta.placeholder='Share something with your campus';
  var fi=el('input',null,null,c);fi.type='file';fi.accept='image/*,video/*,audio/*';
  var r=el('div','row',null,c);var st=el('span','mute',null,r);st.style.flex='1';
  var pb=btn('Post',r,async function(){
    var tx=ta.value.trim(),f=fi.files&&fi.files[0];
    if(!tx&&!f){st.textContent='Write something or choose a file.';return}
    if(f&&f.size>52428800){st.textContent='File too large (50 MB max).';return}
    pb.disabled=true;
    try{
      var mp='',mt='';
      if(f){
        st.textContent='Uploading...';
        var ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';
        mp=S.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
        mt=(f.type||'').split('/')[0];
        await api('POST','/storage/v1/object/media/'+mp,f,{'Content-Type':f.type||'application/octet-stream','x-upsert':'false'},true);
      }
      st.textContent='Posting...';
      await api('POST','/rest/v1/posts',{author_id:S.user.id,caption:tx,media_path:mp,media_type:MT[mt]||''},{Prefer:'return=minimal'});
      ta.value='';fi.value='';st.textContent='Posted.';load();
    }catch(e){st.textContent=msg(e)}
    pb.disabled=false},'');
  var list=el('div',null,null,app);
  async function load(){
    list.textContent='Loading...';
    try{
      var bl=await api('GET','/rest/v1/blocks?select=blocked_id&blocker_id=eq.'+S.user.id);
      var bk=bl.map(function(x){return x.blocked_id});
      var ps=await api('GET','/rest/v1/posts?select=id,author_id,caption,media_path,media_type,created_at&deleted_at=is.null&order=created_at.desc&limit=30');var ids=[];ps.forEach(function(p){if(ids.indexOf(p.author_id)<0)ids.push(p.author_id)});var names={};if(ids.length){var pf=await api('GET','/rest/v1/profiles?select=id,name,certified&id=in.('+ids.join(',')+')');pf.forEach(function(x){names[x.id]=x})}ps.forEach(function(p){p.profiles=names[p.author_id]||null});
      ps=ps.filter(function(p){return bk.indexOf(p.author_id)<0});
      var paths=ps.filter(function(p){return p.media_path}).map(function(p){return p.media_path}),urls={};
      if(paths.length){var sg=await api('POST','/storage/v1/object/sign/media',{expiresIn:3600,paths:paths});sg.forEach(function(x){if(x.signedURL)urls[x.path]=U+'/storage/v1'+x.signedURL})}
      list.textContent='';
      if(!ps.length)el('p','mute','No posts yet. Be the first to share something.',list);
      ps.forEach(function(p){card(p,urls[p.media_path])});
    }catch(e){list.textContent='';el('p','err','Could not load posts. '+msg(e),list);btn('Retry',list,load,'alt')}
  }
  function card(p,url){
    var d=el('div','post',null,list),own=p.author_id===S.user.id;
    el('b',null,((p.profiles&&p.profiles.name)||'Student')+(p.profiles&&p.profiles.certified?' ✔':''),d);
    el('span','mute',' · '+new Date(p.created_at).toLocaleString('en',{dateStyle:'medium',timeStyle:'short'}),d);
    if(url){
      var t=p.media_type,mm=t==='video'?el('video',null,null,d):t==='audio'?el('audio',null,null,d):el('img',null,null,d);
      mm.src=url;if(t!=='image')mm.controls=true;else mm.alt='Post image';
    }
    if(p.caption)el('p',null,p.caption,d).style.margin='6px 0';
    var a=el('div','row',null,d);
    if(own){
      btn('Delete',a,async function(){if(!confirm('Delete this post?'))return;try{await api('PATCH','/rest/v1/posts?id=eq.'+p.id,{deleted_at:new Date().toISOString()},{Prefer:'return=minimal'});load()}catch(e){alert(msg(e))}},'alt');
    }else{
      btn('Report',a,async function(){var why=prompt('Why are you reporting this? (optional)');if(why===null)return;try{await api('POST','/rest/v1/reports',{reporter_id:S.user.id,target_type:'post',target_id:p.id,reason:(why||'').slice(0,500)},{Prefer:'return=minimal'});alert('Thank you. Our team will review it.')}catch(e){alert(msg(e))}},'alt');
      btn('Block',a,async function(){if(!confirm('Block this person? You will no longer see their posts.'))return;try{await api('POST','/rest/v1/blocks',{blocker_id:S.user.id,blocked_id:p.author_id},{Prefer:'return=minimal'});load()}catch(e){alert(msg(e))}},'alt');
    }
  }
  load();
}

  for(var d=1;d<=n;d++)(function(d){var k=calY+'-'+zz(calM+1)+'-'+zz(d);var b=btn(String(d),g,function(){selDay=k;calView()},k===selDay?'':'alt');if(D.ev[k]&&D.ev[k].length)b.style.boxShadow='inset 0 -3px 0 var(--green)'})(d);

/* ---------- Timer: stopwatch, countdown, laps ---------- */
var sw={run:false,st:0,acc:0,laps:[]},cd={run:false,end:0,left:0,mins:25},timeTimer=null;
function swMs(){return sw.acc+(sw.run?Date.now()-sw.st:0)}
function fmt(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s/60)%60;return(h?h+':'+zz(m):zz(m))+':'+zz(s%60)}
function beep(){try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(e){}}
function timeView(){
  app.textContent='';
  var c=el('div','card',null,app);el('h3',null,'Stopwatch',c);
  var big=el('div','big',fmt(swMs()),c);
  var r=el('div','row',null,c);
  btn(sw.run?'Pause':'Start',r,function(){if(sw.run){sw.acc=swMs();sw.run=false}else{sw.st=Date.now();sw.run=true}timeView()},'');
  btn('Lap',r,function(){if(swMs()>0){sw.laps.unshift(fmt(swMs()));timeView()}},'alt');
  btn('Reset',r,function(){sw={run:false,st:0,acc:0,laps:[]};timeView()},'alt');
  sw.laps.slice(0,8).forEach(function(l,i){el('div','mute','Lap '+(sw.laps.length-i)+'   '+l,c)});
  var c2=el('div','card',null,app);el('h3',null,'Study timer (countdown)',c2);
  var cdBig=el('div','big',cd.run?fmt(Math.max(cd.left,0)):fmt(cd.mins*60000),c2);
  var pr=el('div','row',null,c2);
  [5,15,25,50].forEach(function(m){btn(m+' min',pr,function(){if(!cd.run){cd.mins=m;timeView()}},'alt')});
  var r2=el('div','row',null,c2);
  btn(cd.run?'Stop':'Start',r2,function(){if(cd.run){cd.run=false}else{cd.left=cd.mins*60000;cd.end=Date.now()+cd.left;cd.run=true}timeView()},'');
  btn('Reset',r2,function(){cd.run=false;cd.left=0;timeView()},'alt');
  el('p','mute','Pomodoro: 25 min study, then 5 min break.',c2);
  if(timeTimer)clearInterval(timeTimer);
  timeTimer=setInterval(function(){
    if(tab!=='time'){clearInterval(timeTimer);return}
    if(sw.run)big.textContent=fmt(swMs());
    if(cd.run){cd.left=cd.end-Date.now();if(cd.left<=0){cd.run=false;cd.left=0;beep();alert('Time is up!');timeView();return}cdBig.textContent=fmt(cd.left)}
  },250);
}

/* ---------- Plan: timetable, tasks, reminders ---------- */
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],planDay=(new Date().getDay()+6)%7;
function planView(){
  app.textContent='';
  var c=el('div','card',null,app);el('h3',null,'Timetable',c);
  var dr=el('div','days',null,c);
  DAYS.forEach(function(d,i){btn(d,dr,function(){planDay=i;planView()},i===planDay?'':'alt')});
  var L=D.tb[planDay]||[],today=planDay===(new Date().getDay()+6)%7,now=zz(new Date().getHours())+':'+zz(new Date().getMinutes());
  if(!L.length)el('p','mute','No class or task planned for this day.',c);
  L.forEach(function(e,ix){var r=el('div','item',null,c);var on=today&&now>=e.s&&now<e.e;if(on)r.style.color='var(--green)';el('strong',null,e.s+' – '+e.e,r);el('span','t',e.x+(on?'  (now)':''),r);btn('✕',r,function(){L.splice(ix,1);if(!L.length)delete D.tb[planDay];saveD();planView()},'alt')});
  var f=el('div','row',null,c),a=el('input',null,null,f),b=el('input',null,null,f);a.type='time';b.type='time';a.value='08:00';b.value='09:00';
  var f2=el('div','row',null,c),tx=el('input',null,null,f2);tx.placeholder='Subject or task';tx.maxLength=60;
  btn('Add',f2,function(){var x=tx.value.trim();if(!x||!a.value||!b.value||b.value<=a.value)return;var arr=D.tb[planDay]=D.tb[planDay]||[];arr.push({s:a.value,e:b.value,x:x});arr.sort(function(u,v){return u.s.localeCompare(v.s)});saveD();planView()},'');

  var c2=el('div','card',null,app);el('h3',null,'Tasks',c2);
  var done=D.tk.filter(function(t){return t.done}).length;
  el('p','mute',done+' of '+D.tk.length+' done',c2);
  D.tk.slice().sort(function(x,y){return x.done-y.done}).forEach(function(t){var r=el('div','item',null,c2);btn(t.done?'☑':'☐',r,function(){t.done=!t.done;saveD();planView()},'alt');el('span','t'+(t.done?' done':''),t.x+(t.due?'  · '+t.due:''),r);btn('✕',r,function(){D.tk.splice(D.tk.indexOf(t),1);saveD();planView()},'alt')});
  var tf=el('div','row',null,c2),tt=el('input',null,null,tf);tt.placeholder='New task';tt.maxLength=80;var td=el('input',null,null,tf);td.type='date';
  btn('Add',c2,function(){var x=tt.value.trim();if(!x)return;D.tk.push({x:x,due:td.value,done:false});saveD();planView()},'');

  var c3=el('div','card',null,app);el('h3',null,'Reminders',c3);
  el('p','mute','Reminders ring while Weekchat is open.',c3);
  D.rm.forEach(function(r,ix){var row=el('div','item',null,c3);el('span','t'+(r.done?' done':''),new Date(r.at).toLocaleString('en',{dateStyle:'medium',timeStyle:'short'})+' · '+r.x,row);btn('✕',row,function(){D.rm.splice(ix,1);saveD();planView()},'alt')});
  var rf=el('div','row',null,c3),rd=el('input',null,null,rf);rd.type='datetime-local';var rx=el('input',null,null,rf);rx.placeholder='Reminder';rx.maxLength=80;
  btn('Add',c3,function(){var x=rx.value.trim();if(!x||!rd.value)return;D.rm.push({x:x,at:rd.value,done:false});saveD();planView()},'');
}
setInterval(function(){
  if(!S)return;var now=Date.now();
  D.rm.forEach(function(r){if(!r.done&&new Date(r.at).getTime()<=now){r.done=true;saveD();beep();alert('Reminder: '+r.x)}});
},20000);

/* ---------- Profile: Other section ---------- */

  btn('Privacy policy',o,function(){window.open('privacy.html','_blank')},'alt');
  btn('Delete my account',o,deleteAccount,'danger').style.marginTop='14px';
  var dm=el('p','err',null,o);dm.id='dm';
}
async function askMedia(c,label){
  try{var s=await navigator.mediaDevices.getUserMedia(c);s.getTracks().forEach(function(t){t.stop()});alert('Access to the '+label+' is allowed.')}
  catch(e){alert('The '+label+' is not allowed. You can change it in your phone settings.')}
}
async function deleteAccount(){
  var dm=document.getElementById('dm');
  if(!confirm('Do you really want to delete your Weekchat account? Your profile, posts, messages and files will be erased. This cannot be undone.'))return;
  dm.className='mute';dm.textContent='Deleting...';
  try{
    var t=await token();if(!t)throw{msg:'Please sign in first.'};
    var uid=S.user.id,H={apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json'};
    var lr=await fetch(U+'/storage/v1/object/list/media',{method:'POST',headers:H,body:JSON.stringify({prefix:uid,limit:1000,offset:0,sortBy:{column:'name',order:'asc'}})});
    var files=lr.ok?await lr.json():[];
    var paths=(Array.isArray(files)?files:[]).filter(function(f){return f.id}).map(function(f){return uid+'/'+f.name});
    if(paths.length){
      dm.textContent='Deleting your photos and videos...';
      var dr=await fetch(U+'/storage/v1/object/media',{method:'DELETE',headers:H,body:JSON.stringify({prefixes:paths})});
      if(!dr.ok)throw{msg:'Could not delete your photos and videos (error '+dr.status+'). Your account was not deleted.'};
    }
    var rr=await fetch(U+'/rest/v1/rpc/delete_my_account',{method:'POST',headers:H,body:'{}'});
    if(!rr.ok)throw{msg:'Could not delete the account (error '+rr.status+').'};
    saveS(null);alert('Your account has been deleted.');render();
  }catch(e){dm.className='err';dm.textContent=msg(e)}
}

/* ---------- Lessons: courses published by teachers ---------- */
var isTeacher=false;
async function lessView(){
  app.textContent='';
  var c=el('div','card',null,app);
  el('h2',null,'Lessons',c);
  var list=el('div',null,null,app);
  var form=el('div','card',null,app);form.style.display='none';
  try{
    var pr=await api('GET','/rest/v1/profiles?select=role,is_admin&id=eq.'+S.user.id);
    isTeacher=!!(pr&&pr[0]&&(pr[0].is_admin||pr[0].role==='professor'||pr[0].role==='authority'));
  }catch(e){isTeacher=false}
  if(isTeacher){
    form.style.display='block';
    el('h3',null,'New lesson',form);
    var ti=el('input',null,null,form);ti.placeholder='Title';ti.maxLength=200;
    var bo=el('textarea',null,null,form);bo.rows=6;bo.maxLength=50000;bo.placeholder='Write the lesson here';
    var fm=el('div','mute',null,form);
    btn('Publish lesson',form,async function(){
      var t=ti.value.trim(),b=bo.value.trim();if(!t){fm.textContent='Enter a title.';return}
      try{await api('POST','/rest/v1/lessons',{author_id:S.user.id,title:t,body:b},{Prefer:'return=minimal'});ti.value='';bo.value='';fm.textContent='Published.';load()}
      catch(e){fm.textContent=msg(e)}},'');
  }
  async function load(){
    list.textContent='Loading...';
    try{
      var L=await api('GET','/rest/v1/lessons?select=id,author_id,title,body,created_at,profiles(name)&deleted_at=is.null&order=created_at.desc&limit=50');
      list.textContent='';
      if(!L.length)el('p','mute','No lesson yet.',list);
      L.forEach(function(x){
        var d=el('div','card',null,list);
        el('h3',null,x.title,d);
        el('div','mute',((x.profiles&&x.profiles.name)||'Teacher')+' · '+new Date(x.created_at).toLocaleDateString('en',{dateStyle:'medium'}),d);
        el('p',null,x.body,d).style.whiteSpace='pre-wrap';
        if(x.author_id===S.user.id){
          btn('Delete',d,async function(){if(!confirm('Delete this lesson?'))return;try{await api('PATCH','/rest/v1/lessons?id=eq.'+x.id,{deleted_at:new Date().toISOString()},{Prefer:'return=minimal'});load()}catch(e){alert(msg(e))}},'alt');
        }
      });
    }catch(e){list.textContent='';el('p','err','Could not load lessons. '+msg(e),list);btn('Retry',list,load,'alt')}
  }
  load();
}

/* ---------- Work: classes and private messages ---------- */
async function workView(){
  app.textContent='';
  var top=el('div','card',null,app);el('h2',null,'Work',top);
  var box=el('div',null,null,app);
  var cls=el('div','card',null,app);
  var ppl=el('div','card',null,app);
  try{
    var pr=await api('GET','/rest/v1/profiles?select=role,is_admin&id=eq.'+S.user.id);
    isTeacher=!!(pr&&pr[0]&&(pr[0].is_admin||pr[0].role==='professor'||pr[0].role==='authority'));
  }catch(e){isTeacher=false}
  el('h3',null,'Classes',cls);
  if(isTeacher){
    var cn=el('input',null,null,cls);cn.placeholder='New class name';cn.maxLength=80;
    btn('Create class',cls,async function(){var n=cn.value.trim();if(!n)return;try{await api('POST','/rest/v1/classes',{name:n,created_by:S.user.id},{Prefer:'return=minimal'});cn.value='';loadClasses()}catch(e){alert(msg(e))}},'');
  }
  var clist=el('div',null,null,cls);
  async function loadClasses(){
    clist.textContent='Loading...';
    try{var C=await api('GET','/rest/v1/classes?select=id,name&order=created_at.desc');clist.textContent='';
      if(!C.length)el('p','mute','No class yet.',clist);
      C.forEach(function(c){el('div','item',c.name,clist)})}
    catch(e){clist.textContent=msg(e)}
  }
  el('h3',null,'Messages',ppl);
  el('p','mute','Private conversations. Tap a name to write.',ppl);
  var plist=el('div',null,null,ppl);
  async function loadPeople(){
    plist.textContent='Loading...';
    try{
      var P=await api('GET','/rest/v1/profiles?select=id,name,role&order=name.asc&limit=200');
      plist.textContent='';
      P.filter(function(p){return p.id!==S.user.id}).forEach(function(p){
        var r=el('div','item',null,plist);
        el('span','t',(p.name||'Student')+(p.role&&p.role!=='student'?' · '+p.role:''),r);
        btn('Message',r,function(){openChat(p)},'alt');
      });
    }catch(e){plist.textContent=msg(e)}
  }
  function openChat(p){
    box.textContent='';var c=el('div','card',null,box);
    var h=el('div','row',null,c);el('h3',null,'Chat with '+(p.name||'Student'),h).style.flex='1';
    btn('Close',h,function(){box.textContent=''},'alt');
    var ml=el('div',null,null,c);
    var f=el('div','row',null,c),tx=el('input',null,null,f);tx.placeholder='Write a message';tx.maxLength=2000;
    var st=el('span','mute',null,c);
    var cid=null;
    async function load(){
      try{
        if(!cid){cid=await api('POST','/rest/v1/rpc/open_dm',{other:p.id})}
        var M=await api('GET','/rest/v1/messages?select=id,sender_id,ciphertext,created_at&conversation_id=eq.'+cid+'&order=created_at.asc&limit=200');
        ml.textContent='';
        if(!M.length)el('p','mute','No message yet.',ml);
        M.forEach(function(m){var d=el('div',null,null,ml);d.style.cssText='padding:6px 0;text-align:'+(m.sender_id===S.user.id?'right':'left');
          el('span',m.sender_id===S.user.id?'ok':'',m.ciphertext,d)});
        ml.scrollTop=ml.scrollHeight;
      }catch(e){st.textContent=msg(e)}
    }
    btn('Send',f,async function(){
      var t=tx.value.trim();if(!t)return;
      try{if(!cid)cid=await api('POST','/rest/v1/rpc/open_dm',{other:p.id});
        await api('POST','/rest/v1/messages',{conversation_id:cid,sender_id:S.user.id,ciphertext:t},{Prefer:'return=minimal'});tx.value='';load()}
      catch(e){st.textContent=msg(e)}},'');
    btn('Refresh',c,load,'alt');
    load();
  }
  loadClasses();loadPeople();
}

/* ---------- Layout ---------- */
var TABS=[['home','🏡','Home',homeView],['les','📚','Lessons',lessView],['work','💼','Work',workView],['cal','🗓','Calendar',calView],['time','⏱','Timer',timeView],['plan','📋','Plan',planView],['me','👤','Profile',profileView]];
function drawTabs(){
  tabs.textContent='';
  TABS.forEach(function(t){var b=btn(t[1]+'\n'+t[2],tabs,function(){tab=t[0];drawTabs();t[3]()},'');b.style.background='none';b.style.color=(tab===t[0])?'var(--gold)':'var(--mute)'});
}
function render(){
  if(!S){tabs.textContent='';authView();return}
  drawTabs();
  var t=TABS.filter(function(x){return x[0]===tab})[0]||TABS[0];t[3]();
}
function online(){document.getElementById('off').style.display=navigator.onLine?'none':'flex'}
window.addEventListener('online',online);window.addEventListener('offline',online);
online();render();
})();
</script>
